<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b1a"/>
      <stop offset="0.55" stop-color="#0b2c29"/>
      <stop offset="1" stop-color="#123f38"/>
    </linearGradient>
    <linearGradient id="screenFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#071b1a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <clipPath id="dashboardClip"><rect x="66" y="330" width="954" height="480" rx="18"/></clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1390" cy="-80" r="380" fill="#31c5a5" fill-opacity="0.08"/>
  <circle cx="130" cy="850" r="310" fill="#31c5a5" fill-opacity="0.05"/>

  <g transform="translate(66 55)">
    <rect width="42" height="42" rx="12" fill="#28c5a5"/>
    <path d="M10 21 21 11l11 10v12H10Z" fill="none" stroke="#062b27" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="60" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="750" letter-spacing="1.2" fill="#f3fffb">NESTEASE</text>
    <text x="272" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" letter-spacing="2.1" fill="#77d9c6">AI-NATIVE PROPERTY OPERATIONS</text>
  </g>

  <text x="66" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="60" font-weight="760" letter-spacing="-2.6" fill="#f7fffc">From repair request to verified completion.</text>
  <text x="66" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#b9d6d0">AI coordinates bilingual contractor work over SMS.</text>
  <text x="66" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#b9d6d0">Property managers keep approval, exceptions, and auditability in one place.</text>

  <g filter="url(#shadow)">
    <rect x="66" y="300" width="954" height="510" rx="24" fill="#f8fafc"/>
    <rect x="66" y="300" width="954" height="34" rx="24" fill="#dbe5e3"/>
    <rect x="66" y="318" width="954" height="16" fill="#dbe5e3"/>
    <circle cx="91" cy="317" r="5" fill="#f06b63"/><circle cx="109" cy="317" r="5" fill="#e8b34f"/><circle cx="127" cy="317" r="5" fill="#4bbd78"/>
    <text x="154" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#59706d">PM work-order control plane · demo workspace</text>
    <image x="66" y="330" width="954" height="480" xlink:href="../../nestease/public/hero-kanban.png" preserveAspectRatio="xMidYMid slice" clip-path="url(#dashboardClip)"/>
    <rect x="66" y="330" width="954" height="480" fill="url(#screenFade)" clip-path="url(#dashboardClip)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1062" y="275" width="472" height="575" rx="38" fill="#f8faf9" stroke="#5b827b" stroke-width="1.5"/>
    <rect x="1220" y="290" width="156" height="22" rx="11" fill="#102825"/>
    <text x="1097" y="347" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing="1.3" fill="#7b8c89">SANITIZED DEMO · NO PRODUCTION DATA</text>
    <text x="1097" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="750" fill="#142c29">Bilingual contractor SMS</text>

    <rect x="1097" y="407" width="325" height="70" rx="18" fill="#e1f6f0"/>
    <text x="1118" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#183f38">钟师傅，新工单：厨房水龙头漏水。</text>
    <text x="1118" y="457" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#183f38">明天下午可以上门吗？</text>

    <rect x="1182" y="493" width="317" height="70" rx="18" fill="#e9edef"/>
    <text x="1203" y="519" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#20302e">可以。2 小时 × $80，材料 $45。</text>
    <text x="1203" y="543" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#20302e">明天下午完成。</text>

    <rect x="1097" y="579" width="370" height="88" rx="18" fill="#e1f6f0"/>
    <text x="1118" y="605" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#183f38">确认报价：人工 $160 + 材料 $45，</text>
    <text x="1118" y="629" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#183f38">共 $205。回复“确认”后提交审批。</text>
    <text x="1118" y="651" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="650" fill="#15846f">AI collected structured quote</text>

    <rect x="1355" y="683" width="144" height="48" rx="18" fill="#e9edef"/>
    <text x="1403" y="713" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#20302e">确认</text>

    <rect x="1097" y="747" width="370" height="62" rx="18" fill="#173f38"/>
    <text x="1118" y="773" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#eefffa">QUOTE SUBMITTED · OWNER APPROVAL</text>
    <text x="1118" y="795" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#9ee4d5">Workflow advanced with an audited state transition</text>
  </g>

  <g transform="translate(66 844)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#f0fffa">9 AI tools</text>
    <circle cx="111" cy="-6" r="3" fill="#43cdb1"/>
    <text x="130" y="0" font-size="16" font-weight="700" fill="#f0fffa">9-state workflow</text>
    <circle cx="287" cy="-6" r="3" fill="#43cdb1"/>
    <text x="306" y="0" font-size="16" font-weight="700" fill="#f0fffa">38 API routes</text>
    <circle cx="458" cy="-6" r="3" fill="#43cdb1"/>
    <text x="477" y="0" font-size="16" font-weight="700" fill="#f0fffa">36 test files</text>
  </g>
</svg>
